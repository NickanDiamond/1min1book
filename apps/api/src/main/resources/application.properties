spring.application.name=knowledge-graph-api

# Render/Railway/Fly inject PORT at runtime and expect the app to
# bind to it; 8080 stays the default for local dev.
server.port=${PORT:8080}

# Set via env var, e.g.:
#   export SPRING_DATASOURCE_URL=jdbc:postgresql://<host>/<db>?sslmode=require
#   export SPRING_DATASOURCE_USERNAME=...
#   export SPRING_DATASOURCE_PASSWORD=...
# Never commit real values here.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
